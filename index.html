<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00945E">
<meta name="robots" content="noindex,nofollow">
<title>Motum Academy – Träna</title>
<style>
:root{--g:#00945E;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:linear-gradient(160deg,#00A86B,#00945E 45%,#00402B);color:#fff;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab))}
.card{width:100%;max-width:380px;background:#fff;color:#14211C;border-radius:24px;padding:28px 22px 22px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.logo{height:30px;display:block;margin:0 0 22px}
h1{margin:0 0 4px;font-size:23px;letter-spacing:-.01em}
p{margin:0 0 20px;color:#64756E;font-size:14.5px;line-height:1.45}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.pw{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px 48px 14px 14px;border-radius:14px;border:2px solid #E2E8E5;outline:none;transition:border-color .15s}
input:focus{border-color:var(--g)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;font-size:18px;cursor:pointer;color:#64756E}
.rem{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:14px;color:#41524B}
.rem input{width:20px;height:20px;accent-color:var(--g)}
button.go{width:100%;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:17px;padding:15px;cursor:pointer}
button.go:disabled{opacity:.6}
.err{color:#E5484D;font-size:14px;font-weight:600;min-height:20px;margin-top:10px;text-align:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.small{margin-top:16px;text-align:center;font-size:12px;color:#93A79F}
</style>
</head>

const KEY='motum-sysfel-quiz-key-'+D.id;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
async function keyFromPw(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function open(key){
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));
  const html=new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
async function tryStored(){
  try{ const raw=localStorage.getItem(KEY); if(!raw) return;
    const key=await crypto.subtle.importKey('raw',b64(raw),{name:'AES-GCM'},true,['decrypt']);
    await open(key);
  }catch(e){ try{localStorage.removeItem(KEY);}catch(_){} }
}
if(!window.crypto||!crypto.subtle){ $('err').textContent='Webbläsaren stöds inte – öppna länken i Safari eller Chrome.'; $('go').disabled=true; return; }
$('eye').onclick=()=>{const i=$('pw');i.type=i.type==='password'?'text':'password';};
$('f').onsubmit=async e=>{
  e.preventDefault(); const pw=$('pw').value.trim(); if(!pw) return;
  $('go').disabled=true; $('go').textContent='Öppnar …'; $('err').textContent='';
  try{
    const key=await keyFromPw(pw);
    if($('rem').checked){ try{ const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key)); localStorage.setItem(KEY,btoa(String.fromCharCode(...raw))); }catch(_){} }
    await open(key);
  }catch(err){
    $('go').disabled=false; $('go').textContent='Öppna'; $('err').textContent='Fel lösenord – försök igen.';
    $('f').classList.remove('shake'); void $('f').offsetWidth; $('f').classList.add('shake'); $('pw').select();
  }
};
tryStored();
})();
</script>
